name: Update contribution ring

on:
  schedule:
    - cron: '45 18 * * *'   # 00:15 IST daily
  workflow_dispatch:

permissions:
  contents: write            # only needed to commit the regenerated files

concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install --quiet pillow

      - name: Fetch contribution data
        run: node scripts/fetch-contributions.mjs
        env:
          # Built-in token is enough for public data. If GraphQL ever rejects it,
          # add a read-only PAT as the PROFILE_STATS_TOKEN repository secret.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Render GIF and badge
        run: python scripts/render_assets.py

      - name: Commit only if something changed
        run: |
          if [ -z "$(git status --porcelain -- data assets)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git commit -m "chore: refresh contribution ring"
          git push
