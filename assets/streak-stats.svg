<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160"
     role="img" aria-label="Contribution streak statistics">
  <title>Contribution streak statistics</title>
  <rect width="480" height="160" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="240" y1="18" x2="240" y2="142" stroke="#30363d" stroke-width="1"/>

  <!-- LEFT: Current Streak -->
  <text x="120" y="36"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="12" fill="#9ba5b0">Current Streak</text>
  <text x="120" y="88"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="42" font-weight="600" fill="#e6edf3">101</text>
  <text x="120" y="110"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="11" fill="#3fb950">days</text>
  <text x="120" y="132"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="10" fill="#9ba5b0">1 Aug – 9 Nov 2026</text>

  <!-- RIGHT: Longest Streak -->
  <text x="360" y="36"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="12" fill="#9ba5b0">Longest Streak</text>
  <text x="360" y="88"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="42" font-weight="600" fill="#e6edf3">101</text>
  <text x="360" y="110"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="11" fill="#3fb950">days</text>
  <text x="360" y="132"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="10" fill="#9ba5b0">1 Aug – 9 Nov 2026</text>

  <!-- Updated timestamp (bottom-centre, very subtle) -->
  <text x="240" y="155"
        text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="9" fill="#30363d">Updated 10 Nov 2026, 12:47 IST</text>
</svg>
